font_family      Agave Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Keep text opaque while letting the blurred desktop show through the background.
background_opacity 0.85
# Native blur where supported; i3 uses the Kitty-only blur in picom.conf.
background_blur 20

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
