[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #00BFFF
alert = #A54242
disabled = #707880

[bar/example]
width = 60%
offset-x = 20%
offset-y = 0
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 4pt

module-margin = 4pt

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font;2
font-1 = JetBrainsMono Nerd Font:size=9;2

modules-left = xworkspaces xwindow
modules-center = date
modules-right = pulseaudio battery monitor-brightness systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3

; Keep i3 from stretching this partial-width bar across the monitor.
override-redirect = true

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-font = 2
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}

format-muted = <label-muted>
format-muted-font = 2
label-muted = 󰖁 muted
label-muted-foreground = ${colors.disabled}

click-left = #pulseaudio.toggle
click-right = pavucontrol
scroll-up = #pulseaudio.inc
scroll-down = #pulseaudio.dec

[module/battery]
type = custom/script
exec = bash "$HOME/.config/polybar/battery.sh"
interval = 5

label = %output%
label-font = 2
format-fail = <label-fail>
label-fail = N/A 
label-fail-font = 2
label-fail-foreground = ${colors.disabled}

[module/monitor-brightness]
type = custom/script
exec = bash "$HOME/.config/polybar/monitor-brightness.sh"
interval = 5

label = 󰃠 %output%
label-font = 2
format-fail = <label-fail>
label-fail = 󰃠 N/A
label-fail-font = 2
label-fail-foreground = ${colors.disabled}

scroll-up = bash "$HOME/.config/polybar/monitor-brightness.sh" up
scroll-down = bash "$HOME/.config/polybar/monitor-brightness.sh" down

[module/systray]
type = internal/tray

format-margin = 4pt
tray-spacing = 8pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
; Keep long window titles from crowding the clock and system tray.
label = %title%
label-maxlen = 20
label-ellipsis = true

[module/date]
type = internal/date
interval = 1

date = %I:%M %p
date-alt = %Y-%m-%d %I:%M:%S %p

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
; Use picom for real transparency around borders and rounded corners.
pseudo-transparency = false

; vim:ft=dosini
