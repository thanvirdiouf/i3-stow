#====================================================#
#                picom.conf custom                   #
#====================================================#
shadow = true;

shadow-radius = 14;
shadow-opacity = 0.85;
shadow-offset-x = -12;
shadow-offset-y = -12;
fading = true;
fade-in-step = 0.12;
fade-out-step = 0.12;
frame-opacity = 1.0;
corner-radius = 15;
# Kitty's native blur does not support i3; blur its transparent background here.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-fixed = true;
# Specify the backend to use: `xrender`, `glx`, or `egl`.
#
# Default: "xrender"
backend = "glx";
# i3 draws its borders inside the frame, so picom cannot detect their width.
window-shader-fg-rule = [ "rounded-border.frag:class_g ?= 'kitty'" ];
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
# Keep polybar free of compositor effects on picom 10 and older.
shadow-exclude = [ "class_g ?= 'polybar'" ];
fade-exclude = [ "class_g ?= 'polybar'" ];
blur-background-exclude = [
  "class_g ?= 'polybar'",
  "class_g != 'kitty' && class_g != 'Kitty'"
];
rounded-corners-exclude = [ "class_g ?= 'polybar'" ];
opacity-rule = [ "100:class_g ?= 'polybar'" ];

# See WINDOW RULES section in the man page for how these work.
rules: ({
  # Scope blur to Kitty when using newer picom's rules API, too.
  match = "class_g != 'kitty' && class_g != 'Kitty'";
  blur-background = false;
}, {
  match = "class_g ?= 'kitty'";
  blur-background = true;
  shader = "rounded-border.frag";
}, {
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type != 'dock'";
  # shader = "my_shader.frag";
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  # Newer picom versions use rules instead of the exclusions above.
  match = "class_g ?= 'polybar'";
  shadow = false;
  fade = false;
  blur-background = false;
  corner-radius = 0;
  opacity = 1.0;
  dim = 0.0;
})
# @include "extra.conf"
