#====================================================#
#                picom.conf custom                   #
#====================================================#
shadow = true;

shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
fading = true;
fade-in-step = 0.12;
fade-out-step = 0.12;
frame-opacity = 0.7;
corner-radius =15
blur-kern = "3x3box";
# Specify the backend to use: `xrender`, `glx`, or `egl`.
#
# Default: "xrender"
backend = "glx"
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
# Keep polybar free of compositor effects on picom 10 and older.
shadow-exclude = [ "class_g ?= 'polybar'" ];
fade-exclude = [ "class_g ?= 'polybar'" ];
blur-background-exclude = [ "class_g ?= 'polybar'" ];
rounded-corners-exclude = [ "class_g ?= 'polybar'" ];
opacity-rule = [ "100:class_g ?= 'polybar'" ];

# See WINDOW RULES section in the man page for how these work.
rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type != 'dock'";
  # shader = "my_shader.frag";
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  # Newer picom versions use rules instead of the exclusions above.
  match = "class_g ?= 'polybar'";
  shadow = false;
  fade = false;
  blur-background = false;
  corner-radius = 0;
  opacity = 1.0;
  dim = 0.0;
})
# @include "extra.conf"
