# Picom 12+; selected by start.sh.
@include "common.conf"

# See WINDOW RULES section in the man page for how these work.
rules: ({
  match = "WM_CLASS = 'i3-frame' && !fullscreen";
  shader = "rounded-border.frag";
  # Upstream Picom 12+ animates i3's otherwise instant tile geometry changes.
  # Keep this local to frames: Quickshell docks and i3lock stay immediate.
  animations = ({
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.20;
  });
}, {
  # bspwm decorates clients directly rather than using i3 frame windows.
  match = "_SPECTRE_BSPWM@ = 1 && window_type = 'normal' && !fullscreen && class_g != 'i3lock' && name != 'Spectre · System Monitor'";
  shader = "rounded-border.frag";
  animations = ({ triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.20; });
}, {
  # Modern rules do not automatically remove rounding from fullscreen windows.
  match = "fullscreen";
  corner-radius = 0;
}, {
  # Blur only Kitty's transparent background.
  match = "class_g != 'kitty' && class_g != 'Kitty'";
  blur-background = false;
}, {
  match = "class_g ?= 'kitty'";
  blur-background = true;
}, {
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  # Quickshell's dock has no WM_CLASS; match its name and window type.
  match = "class_g ?= 'polybar' || (window_type = 'dock' && name = 'quickshell')";
  shadow = false;
  fade = false;
  blur-background = false;
  corner-radius = 0;
  opacity = 1.0;
  dim = 0.0;
}, {
  match = "class_g = 'i3lock'";
  shader = "lockscreen.frag";
  shadow = false;
  fade = false;
  blur-background = false;
  corner-radius = 0;
  opacity = 1.0;
  dim = 0.0;
  unredir = false;
})
