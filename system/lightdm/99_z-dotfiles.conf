[greeter]
theme-name=Dotfiles-LightDM
icon-theme-name=ePapirus-Dark
cursor-theme-name=Bibata-Modern-Ice
font-name=JetBrainsMono Nerd Font 11
background=/usr/local/share/backgrounds/dotfiles-lightdm/wall.jpg
user-background=false
# Keep the card in the open space to the right of the wallpaper portrait.
position=72%,center 50%,center
indicators=~host;~spacer;~clock;~spacer;~session;~language;~layout;~a11y;~power
clock-format=%a %d %b  %H:%M
